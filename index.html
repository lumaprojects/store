<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Luma Store</title>

    <meta property="og:title" content="Luma Store" />
  <meta property="og:description" content="Welcome to Luma Store! An App Store for Windows 10 and Windows 10 Mobile!" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://lumaprojects.github.io/store" />
  <meta property="og:image" content="https://lumaprojects.github.io/store/icons/store.png" />
  <meta name="theme-color" content="#5C1DA8">
  <link rel="icon" type="image/x-icon" href="icons/favicon.ico"> 
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1>Luma Store</h1>

  <div class="filters">
    <button id="btnAll" class="active">All Apps</button>
    <button id="btnW10M">Windows 10 Mobile</button>
    <button id="btnW10">Windows 10</button>
  </div>
</header>

<main>
  <div id="appsGrid" class="grid"></div>
</main>

<!-- APP MODAL -->
<div id="appModal" class="modal hidden">
  <div class="modal-content">
    <button id="closeModal">×</button>
    <img id="appIcon">
    <h2 id="appName"></h2>
    <p id="appDeveloper"></p>
    <p id="appVersion"></p>
    <p id="appDescription"></p>
    <a id="installBtn" target="_blank">Download</a>
  </div>
</div>

<script src="store.js"></script>
</body>
</html>
